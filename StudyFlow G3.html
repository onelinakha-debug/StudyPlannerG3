<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>StudyFlow G3 · Complete Learning Platform</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #faf5ff;
      --bg-tertiary: #f3e8ff;
      --text-primary: #1e0033;
      --text-secondary: #4a0066;
      --text-muted: #6b21a8;
      --purple-primary: #7c3aed;
      --purple-light: #a78bfa;
      --purple-dark: #5b21b6;
      --purple-gradient: linear-gradient(135deg, #7c3aed 0%, #a78bfa 50%, #c4b5fd 100%);
      --border-light: #e9d5ff;
      --border-medium: #d8b4fe;
      --shadow-sm: 0 2px 8px rgba(124, 58, 237, 0.08);
      --shadow-md: 0 8px 24px rgba(124, 58, 237, 0.12);
      --shadow-lg: 0 16px 48px rgba(124, 58, 237, 0.16);
      --card-bg: rgba(255, 255, 255, 0.9);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    body.dark-mode {
      --bg-primary: #0a0015;
      --bg-secondary: #1a002b;
      --bg-tertiary: #2d0047;
      --text-primary: #f3e8ff;
      --text-secondary: #d8b4fe;
      --text-muted: #a78bfa;
      --border-light: #4a0066;
      --border-medium: #6b21a8;
      --card-bg: rgba(26, 0, 43, 0.9);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: var(--bg-tertiary);
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--purple-gradient);
      border-radius: 10px;
    }

    /* Login Page */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: 32px;
      padding: 48px;
      max-width: 450px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      font-size: 36px;
      font-weight: 800;
      background: var(--purple-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .role-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .role-btn {
      padding: 12px;
      border: 2px solid var(--border-light);
      background: var(--bg-secondary);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      color: var(--text-primary);
    }

    .role-btn.active {
      border-color: var(--purple-primary);
      background: var(--purple-gradient);
      color: white;
    }

    .role-btn:hover {
      border-color: var(--purple-primary);
      transform: translateY(-2px);
    }

    /* App Layout */
    .app-container {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    .sidebar {
      width: 280px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-light);
      padding: 24px 16px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }

    .sidebar.closed {
      transform: translateX(-100%);
    }

    .logo-area {
      padding: 8px 12px 24px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 24px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      background: var(--purple-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .nav-menu {
      list-style: none;
    }

    .nav-item {
      margin-bottom: 8px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 12px;
      transition: all 0.2s;
      font-weight: 500;
      cursor: pointer;
    }

    .nav-link i {
      width: 20px;
      height: 20px;
      color: var(--purple-primary);
    }

    .nav-link:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .nav-link.active {
      background: var(--purple-gradient);
      color: white;
    }

    .nav-link.active i {
      color: white;
    }

    .main-content {
      flex: 1;
      margin-left: 280px;
      transition: margin-left 0.3s;
      min-height: 100vh;
      background: var(--bg-secondary);
    }

    .main-content.expanded {
      margin-left: 0;
    }

    .header {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .menu-toggle {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .menu-toggle:hover {
      background: var(--purple-light);
      color: white;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: var(--bg-tertiary);
      border-radius: 20px;
      border: 1px solid var(--border-light);
    }

    .page-container {
      padding: 32px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .page {
      display: none;
      animation: slideIn 0.4s ease-out;
    }

    .page.active {
      display: block;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      padding: 24px;
      transition: all 0.3s;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .card:hover {
      border-color: var(--purple-light);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    /* Buttons */
    .btn {
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
    }

    .btn-primary {
      background: var(--purple-gradient);
      color: white;
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-lg);
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: var(--purple-light);
      color: white;
    }

    /* Form Elements */
    input, select, textarea {
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.2s;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--purple-primary);
      background: var(--bg-primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 24px;
      transition: all 0.3s;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      background: var(--purple-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Task Items */
    .task-item {
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }

    .task-item:hover {
      background: var(--bg-tertiary);
      border-color: var(--purple-light);
    }

    /* Badges */
    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-admin {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: white;
    }

    .badge-lecturer {
      background: linear-gradient(135deg, #6b21a8, #9333ea);
      color: white;
    }

    .badge-student {
      background: var(--purple-gradient);
      color: white;
    }

    .badge-leader {
      background: linear-gradient(135deg, #5b21b6, #8b5cf6);
      color: white;
    }

    .badge-member {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    /* Progress Bars */
    .progress-bar {
      height: 8px;
      background: var(--bg-tertiary);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--purple-gradient);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: 24px;
      padding: 32px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2000;
    }

    .toast {
      background: var(--card-bg);
      color: var(--text-primary);
      padding: 16px 24px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid var(--purple-primary);
    }

    /* Group Member List */
    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid var(--border-light);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        max-width: 280px;
      }
      
      .main-content {
        margin-left: 0;
      }
      
      .page-container {
        padding: 20px 16px;
      }
      
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Login Page -->
  <div id="loginPage" class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">StudyFlow G3</div>
        <p style="color: var(--text-secondary);">Learn Smarter, Together</p>
      </div>
      
      <div class="role-selector">
        <div class="role-btn active" data-role="student" onclick="selectRole('student')">
          <i data-lucide="user"></i>
          <div style="margin-top: 4px;">Student</div>
        </div>
        <div class="role-btn" data-role="lecturer" onclick="selectRole('lecturer')">
          <i data-lucide="book-open"></i>
          <div style="margin-top: 4px;">Lecturer</div>
        </div>
        <div class="role-btn" data-role="admin" onclick="selectRole('admin')">
          <i data-lucide="shield"></i>
          <div style="margin-top: 4px;">Admin</div>
        </div>
      </div>
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <input type="text" id="username" placeholder="Username" required style="margin-bottom: 16px;" value="alex_student">
        <input type="password" id="password" placeholder="Password" required style="margin-bottom: 24px;" value="password123">
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <i data-lucide="log-in"></i>
          Login
        </button>
      </form>
      
      <div style="text-align: center; margin-top: 16px; font-size: 12px; color: var(--text-muted);">
        Demo: student/password123 · lecturer/teach123 · admin/admin123
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="mainApp" class="app-container" style="display: none;">
    <nav class="sidebar" id="sidebar">
      <div class="logo-area">
        <div class="logo">StudyFlow G3</div>
        <div style="font-size: 12px; opacity: 0.7; margin-top: 8px;" id="userRoleDisplay"></div>
      </div>
      
      <ul class="nav-menu" id="navMenu"></ul>
      
      <div style="margin-top: 32px; padding: 16px;">
        <div class="card" style="padding: 16px;">
          <div style="font-weight: 600; margin-bottom: 8px;">🔥 <span id="streakDisplay">0</span> Day Streak</div>
          <div class="progress-bar" style="margin-bottom: 8px;">
            <div class="progress-fill" style="width: 80%;"></div>
          </div>
          <div style="font-size: 12px;">Level <span id="levelDisplay">1</span> Scholar</div>
        </div>
      </div>
    </nav>

    <main class="main-content" id="mainContent">
      <header class="header">
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="menu-toggle" id="menuToggle">
            <i data-lucide="menu"></i>
          </button>
          <div>
            <h1 style="font-size: 24px; font-weight: 700;" id="headerTitle">Dashboard</h1>
            <p style="opacity: 0.7; font-size: 14px;" id="welcomeMessage"></p>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
          <div class="user-badge" id="userBadge"></div>
          <button class="btn btn-secondary" onclick="toggleDarkMode()">
            <i data-lucide="moon" id="darkModeIcon"></i>
          </button>
          <button class="btn btn-secondary" onclick="openSettings()">
            <i data-lucide="settings"></i>
          </button>
          <button class="btn btn-secondary" onclick="logout()">
            <i data-lucide="log-out"></i>
          </button>
        </div>
      </header>

      <div id="pageContainer"></div>
    </main>
  </div>

  <!-- Modals -->
  <div class="modal-overlay" id="createGroupModal">
    <div class="modal">
      <h2 style="margin-bottom: 24px;">Create Study Group</h2>
      <form id="createGroupForm" onsubmit="createGroup(event)">
        <input type="text" id="groupName" placeholder="Group Name" required style="margin-bottom: 16px;">
        <input type="text" id="groupCourse" placeholder="Course Code/Name" required style="margin-bottom: 16px;">
        <textarea id="groupDescription" placeholder="Description" rows="3" style="margin-bottom: 16px;"></textarea>
        <input type="number" id="maxMembers" placeholder="Max Members" value="30" style="margin-bottom: 24px;">
        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('createGroupModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Group</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="addMemberModal">
    <div class="modal">
      <h2 style="margin-bottom: 24px;">Add Group Member</h2>
      <form id="addMemberForm" onsubmit="addGroupMember(event)">
        <input type="hidden" id="currentGroupId">
        <input type="text" id="memberUsername" placeholder="Username" required style="margin-bottom: 16px;">
        <select id="memberRole" style="margin-bottom: 24px;">
          <option value="member">Member</option>
          <option value="leader">Group Leader</option>
        </select>
        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('addMemberModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Member</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2 style="margin-bottom: 24px;">Settings</h2>
      
      <div style="margin-bottom: 24px;">
        <h3 style="margin-bottom: 12px;">Appearance</h3>
        <button class="btn btn-secondary" onclick="toggleDarkMode()">
          <i data-lucide="moon"></i>
          Toggle Dark Mode
        </button>
      </div>
      
      <div style="margin-bottom: 24px;">
        <h3 style="margin-bottom: 12px;">Notifications</h3>
        <label style="display: flex; align-items: center; gap: 12px;">
          <input type="checkbox" checked> Email notifications
        </label>
        <label style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
          <input type="checkbox" checked> Browser notifications
        </label>
      </div>
      
      <div style="display: flex; justify-content: flex-end;">
        <button class="btn btn-primary" onclick="closeModal('settingsModal')">Save Settings</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // Global State
    let currentUser = null;
    let selectedRole = 'student';
    let darkMode = false;
    
    let appData = {
      users: [],
      groups: [],
      assignments: [],
      submissions: [],
      tasks: [],
      subjects: [],
      sessions: []
    };

    // Initialize Data
    function initializeData() {
      const saved = localStorage.getItem('studyflow_data');
      if (saved) {
        appData = JSON.parse(saved);
      } else {
        appData = {
          users: [
            { username: 'alex_student', password: 'password123', role: 'student', name: 'Alex Chen', level: 8, streak: 12 },
            { username: 'prof_smith', password: 'teach123', role: 'lecturer', name: 'Dr. Smith', department: 'Computer Science' },
            { username: 'admin', password: 'admin123', role: 'admin', name: 'Admin User' }
          ],
          groups: [
            { id: '1', name: 'CS50 Study Group', course: 'CS50', description: 'Introduction to Computer Science', leader: 'alex_student', members: ['alex_student'], maxMembers: 30, createdAt: new Date().toISOString() }
          ],
          assignments: [],
          submissions: [],
          tasks: [
            { id: '1', title: 'Complete Calculus Assignment', subject: 'Mathematics', deadline: '2026-04-25', priority: 'high', completed: false, userId: 'alex_student' },
            { id: '2', title: 'Read Physics Chapter 5', subject: 'Physics', deadline: '2026-04-23', priority: 'medium', completed: false, userId: 'alex_student' }
          ],
          subjects: [
            { name: 'Mathematics', progress: 67, targetHours: 12 },
            { name: 'Physics', progress: 40, targetHours: 10 },
            { name: 'Computer Science', progress: 75, targetHours: 8 }
          ],
          sessions: []
        };
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem('studyflow_data', JSON.stringify(appData));
    }

    // Role Selection
    function selectRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.role === role) {
          btn.classList.add('active');
        }
      });
      
      // Update demo credentials hint
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      
      if (role === 'student') {
        usernameInput.value = 'alex_student';
        passwordInput.value = 'password123';
      } else if (role === 'lecturer') {
        usernameInput.value = 'prof_smith';
        passwordInput.value = 'teach123';
      } else if (role === 'admin') {
        usernameInput.value = 'admin';
        passwordInput.value = 'admin123';
      }
    }

    // Login Handler
    function handleLogin(event) {
      event.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      console.log('Login attempt:', { username, role: selectedRole });
      
      const user = appData.users.find(u => u.username === username && u.password === password);
      
      if (user && user.role === selectedRole) {
        currentUser = user;
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        
        initializeApp();
        showToast(`Welcome back, ${user.name}!`, 'success');
      } else {
        showToast('Invalid credentials or role mismatch. Try: ' + 
                 (selectedRole === 'student' ? 'alex_student/password123' : 
                  selectedRole === 'lecturer' ? 'prof_smith/teach123' : 'admin/admin123'), 'error');
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
      showToast('Logged out successfully');
    }

    // Initialize App
    function initializeApp() {
      document.getElementById('userRoleDisplay').textContent = 
        `${currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1)} · ${currentUser.name}`;
      document.getElementById('welcomeMessage').textContent = 
        `${currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1)} · Level ${currentUser.level || 1}`;
      document.getElementById('userBadge').innerHTML = `
        <span class="badge badge-${currentUser.role}">${currentUser.role.toUpperCase()}</span>
        <span>${currentUser.name}</span>
      `;
      document.getElementById('streakDisplay').textContent = currentUser.streak || 0;
      document.getElementById('levelDisplay').textContent = currentUser.level || 1;
      
      setupNavigation();
      renderDashboard();
      
      lucide.createIcons();
    }

    function setupNavigation() {
      const navMenu = document.getElementById('navMenu');
      let menuItems = [
        { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard', roles: ['student', 'lecturer', 'admin'] },
        { id: 'tasks', icon: 'check-square', label: 'Tasks', roles: ['student', 'lecturer', 'admin'] },
        { id: 'timetable', icon: 'calendar', label: 'Timetable', roles: ['student', 'lecturer', 'admin'] },
        { id: 'groups', icon: 'users', label: 'Study Groups', roles: ['student', 'lecturer', 'admin'] }
      ];
      
      if (currentUser.role === 'lecturer' || currentUser.role === 'admin') {
        menuItems.push({ id: 'assignments', icon: 'file-text', label: 'Assignments', roles: ['lecturer', 'admin'] });
      }
      
      if (currentUser.role === 'student') {
        menuItems.push({ id: 'myassignments', icon: 'file-check', label: 'My Assignments', roles: ['student'] });
      }
      
      menuItems.push(
        { id: 'progress', icon: 'trending-up', label: 'Progress', roles: ['student', 'lecturer', 'admin'] },
        { id: 'achievements', icon: 'trophy', label: 'Achievements', roles: ['student', 'lecturer', 'admin'] }
      );
      
      navMenu.innerHTML = menuItems
        .filter(item => item.roles.includes(currentUser.role))
        .map(item => `
          <li class="nav-item">
            <a class="nav-link ${item.id === 'dashboard' ? 'active' : ''}" onclick="switchPage('${item.id}')">
              <i data-lucide="${item.icon}"></i>
              ${item.label}
            </a>
          </li>
        `).join('');
      
      lucide.createIcons();
    }

    function switchPage(pageName) {
      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
      event.target.closest('.nav-link').classList.add('active');
      
      document.getElementById('headerTitle').textContent = 
        pageName.charAt(0).toUpperCase() + pageName.slice(1);
      
      renderPage(pageName);
    }

    function renderPage(pageName) {
      const container = document.getElementById('pageContainer');
      
      switch(pageName) {
        case 'dashboard':
          renderDashboard();
          break;
        case 'tasks':
          renderTasks();
          break;
        case 'timetable':
          renderTimetable();
          break;
        case 'groups':
          renderGroups();
          break;
        case 'assignments':
          renderAssignments();
          break;
        case 'myassignments':
          renderMyAssignments();
          break;
        case 'progress':
          renderProgress();
          break;
        case 'achievements':
          renderAchievements();
          break;
      }
    }

    function renderDashboard() {
      const container = document.getElementById('pageContainer');
      const myGroups = appData.groups.filter(g => g.members.includes(currentUser.username));
      const myTasks = appData.tasks.filter(t => t.userId === currentUser.username && !t.completed);
      
      container.innerHTML = `
        <div class="page-container">
          <div class="stats-grid">
            <div class="stat-card">
              <i data-lucide="clock" style="color: var(--purple-primary); margin-bottom: 12px;"></i>
              <div class="stat-value">2.5</div>
              <div style="opacity: 0.7;">Hours Today</div>
            </div>
            <div class="stat-card">
              <i data-lucide="target" style="color: var(--purple-primary); margin-bottom: 12px;"></i>
              <div class="stat-value">${appData.tasks.filter(t => t.userId === currentUser.username && t.completed).length}</div>
              <div style="opacity: 0.7;">Tasks Completed</div>
            </div>
            <div class="stat-card">
              <i data-lucide="users" style="color: var(--purple-primary); margin-bottom: 12px;"></i>
              <div class="stat-value">${myGroups.length}</div>
              <div style="opacity: 0.7;">Active Groups</div>
            </div>
            <div class="stat-card">
              <i data-lucide="flame" style="color: var(--purple-primary); margin-bottom: 12px;"></i>
              <div class="stat-value">${currentUser.streak || 0}</div>
              <div style="opacity: 0.7;">Day Streak</div>
            </div>
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
            <div class="card">
              <h3 style="margin-bottom: 20px;">📋 Recent Tasks</h3>
              ${myTasks.slice(0, 3).map(task => `
                <div class="task-item">
                  <div>
                    <div style="font-weight: 600;">${task.title}</div>
                    <div style="font-size: 12px; opacity: 0.7;">${task.subject} · Due ${task.deadline}</div>
                  </div>
                  <span class="badge" style="background: ${task.priority === 'high' ? 'var(--danger)' : task.priority === 'medium' ? 'var(--warning)' : 'var(--success)'}; color: white;">
                    ${task.priority}
                  </span>
                </div>
              `).join('') || '<p style="opacity: 0.7;">No pending tasks</p>'}
            </div>
            
            <div class="card">
              <h3 style="margin-bottom: 20px;">👥 My Groups</h3>
              ${myGroups.map(group => `
                <div class="task-item">
                  <div>
                    <div style="font-weight: 600;">${group.name}</div>
                    <div style="font-size: 12px; opacity: 0.7;">${group.course} · ${group.members.length} members</div>
                  </div>
                  ${group.leader === currentUser.username ? '<span class="badge badge-leader">LEADER</span>' : ''}
                </div>
              `).join('') || '<p style="opacity: 0.7;">No groups yet</p>'}
            </div>
          </div>
        </div>
      `;
      
      lucide.createIcons();
    }

    function renderGroups() {
      const container = document.getElementById('pageContainer');
      const myGroups = appData.groups.filter(g => g.members.includes(currentUser.username));
      
      container.innerHTML = `
        <div class="page-container">
          <div style="display: flex; justify-content: space-between; margin-bottom: 24px;">
            <h2>Study Groups</h2>
            <button class="btn btn-primary" onclick="openModal('createGroupModal')">
              <i data-lucide="plus"></i>
              Create Group
            </button>
          </div>
          
          ${myGroups.length > 0 ? myGroups.map(group => `
            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: start;">
                <div>
                  <h3>${group.name}</h3>
                  <p style="opacity: 0.7; margin-top: 4px;">${group.course} · ${group.members.length}/${group.maxMembers} members</p>
                  <p style="margin-top: 8px;">👑 Leader: ${group.leader}</p>
                  <p style="margin-top: 4px; opacity: 0.7;">${group.description || ''}</p>
                </div>
                <div style="display: flex; gap: 8px;">
                  ${group.leader === currentUser.username ? `
                    <button class="btn btn-secondary" onclick="openAddMemberModal('${group.id}')">
                      <i data-lucide="user-plus"></i>
                      Add Member
                    </button>
                  ` : ''}
                </div>
              </div>
              
              <div style="margin-top: 20px;">
                <h4 style="margin-bottom: 12px;">Members (${group.members.length})</h4>
                ${group.members.map(member => `
                  <div class="member-item">
                    <span>${member}</span>
                    <span class="badge ${member === group.leader ? 'badge-leader' : 'badge-member'}">
                      ${member === group.leader ? 'LEADER' : 'MEMBER'}
                    </span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('') : '<p style="opacity: 0.7; text-align: center; padding: 40px;">No groups yet. Create one!</p>'}
        </div>
      `;
      
      lucide.createIcons();
    }

    function createGroup(event) {
      event.preventDefault();
      
      const group = {
        id: Date.now().toString(),
        name: document.getElementById('groupName').value,
        course: document.getElementById('groupCourse').value,
        description: document.getElementById('groupDescription').value,
        leader: currentUser.username,
        members: [currentUser.username],
        maxMembers: parseInt(document.getElementById('maxMembers').value),
        createdAt: new Date().toISOString()
      };
      
      appData.groups.push(group);
      saveData();
      
      closeModal('createGroupModal');
      renderGroups();
      showToast(`Group "${group.name}" created successfully!`);
      
      document.getElementById('groupName').value = '';
      document.getElementById('groupCourse').value = '';
      document.getElementById('groupDescription').value = '';
      document.getElementById('maxMembers').value = '30';
    }

    function openAddMemberModal(groupId) {
      document.getElementById('currentGroupId').value = groupId;
      openModal('addMemberModal');
    }

    function addGroupMember(event) {
      event.preventDefault();
      
      const groupId = document.getElementById('currentGroupId').value;
      const username = document.getElementById('memberUsername').value;
      const role = document.getElementById('memberRole').value;
      
      const group = appData.groups.find(g => g.id === groupId);
      
      if (group) {
        if (group.members.length >= group.maxMembers) {
          showToast('Group is full!', 'error');
          return;
        }
        
        if (!group.members.includes(username)) {
          group.members.push(username);
          
          if (role === 'leader') {
            group.leader = username;
          }
          
          saveData();
          closeModal('addMemberModal');
          renderGroups();
          showToast(`${username} added to group!`);
        } else {
          showToast('User already in group!', 'error');
        }
      }
    }

    function renderTasks() {
      const container = document.getElementById('pageContainer');
      const myTasks = appData.tasks.filter(t => t.userId === currentUser.username);
      
      container.innerHTML = `
        <div class="page-container">
          <div style="display: flex; justify-content: space-between; margin-bottom: 24px;">
            <h2>My Tasks</h2>
            <button class="btn btn-primary" onclick="addNewTask()">
              <i data-lucide="plus"></i>
              Add Task
            </button>
          </div>
          
          <div class="card">
            ${myTasks.length > 0 ? myTasks.map(task => `
              <div class="task-item ${task.completed ? 'completed' : ''}">
                <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
                  <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${task.id}')">
                  <div>
                    <div style="font-weight: 600; ${task.completed ? 'text-decoration: line-through;' : ''}">${task.title}</div>
                    <div style="font-size: 12px; opacity: 0.7;">${task.subject} · Due ${task.deadline}</div>
                  </div>
                </div>
                <div style="display: flex; gap: 8px;">
                  <span class="badge" style="background: ${task.priority === 'high' ? 'var(--danger)' : task.priority === 'medium' ? 'var(--warning)' : 'var(--success)'}; color: white;">
                    ${task.priority}
                  </span>
                  <button class="btn btn-secondary" onclick="deleteTask('${task.id}')">
                    <i data-lucide="trash-2"></i>
                  </button>
                </div>
              </div>
            `).join('') : '<p style="opacity: 0.7; text-align: center; padding: 40px;">No tasks yet</p>'}
          </div>
        </div>
      `;
      
      lucide.createIcons();
    }

    function addNewTask() {
      const title = prompt('Task title:');
      if (title) {
        const task = {
          id: Date.now().toString(),
          title: title,
          subject: 'General',
          deadline: new Date().toISOString().split('T')[0],
          priority: 'medium',
          completed: false,
          userId: currentUser.username
        };
        
        appData.tasks.push(task);
        saveData();
        renderTasks();
        showToast('Task added!');
      }
    }

    function toggleTask(taskId) {
      const task = appData.tasks.find(t => t.id === taskId);
      if (task) {
        task.completed = !task.completed;
        saveData();
        renderTasks();
        showToast(task.completed ? 'Task completed! 🎉' : 'Task uncompleted');
      }
    }

    function deleteTask(taskId) {
      appData.tasks = appData.tasks.filter(t => t.id !== taskId);
      saveData();
      renderTasks();
      showToast('Task deleted');
    }

    function renderTimetable() {
      const container = document.getElementById('pageContainer');
      
      container.innerHTML = `
        <div class="page-container">
          <h2 style="margin-bottom: 24px;">Weekly Timetable</h2>
          <div class="card">
            <p style="text-align: center; padding: 40px;">Timetable feature coming soon!</p>
          </div>
        </div>
      `;
    }

    function renderAssignments() {
      const container = document.getElementById('pageContainer');
      
      container.innerHTML = `
        <div class="page-container">
          <div style="display: flex; justify-content: space-between; margin-bottom: 24px;">
            <h2>Assignments</h2>
            <button class="btn btn-primary" onclick="showToast('Assignment creation coming soon!')">
              <i data-lucide="plus"></i>
              Create Assignment
            </button>
          </div>
          <div class="card">
            <p style="text-align: center; padding: 40px;">No assignments yet</p>
          </div>
        </div>
      `;
      
      lucide.createIcons();
    }

    function renderMyAssignments() {
      const container = document.getElementById('pageContainer');
      
      container.innerHTML = `
        <div class="page-container">
          <h2 style="margin-bottom: 24px;">My Assignments</h2>
          <div class="card">
            <p style="text-align: center; padding: 40px;">No assignments yet</p>
          </div>
        </div>
      `;
    }

    function renderProgress() {
      const container = document.getElementById('pageContainer');
      
      container.innerHTML = `
        <div class="page-container">
          <h2 style="margin-bottom: 24px;">Progress Analytics</h2>
          
          <div class="stats-grid">
            <div class="stat-card">
              <h3>Total Study Time</h3>
              <div class="stat-value">48.5</div>
              <div>Hours this month</div>
            </div>
            <div class="stat-card">
              <h3>Tasks Completed</h3>
              <div class="stat-value">${appData.tasks.filter(t => t.userId === currentUser.username && t.completed).length}</div>
              <div>All time</div>
            </div>
            <div class="stat-card">
              <h3>Average Focus</h3>
              <div class="stat-value">84%</div>
              <div>Focus score</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAchievements() {
      const container = document.getElementById('pageContainer');
      
      const achievements = [
        { name: 'Early Bird', icon: 'sun', unlocked: true },
        { name: 'Task Master', icon: 'check-circle', unlocked: appData.tasks.filter(t => t.userId === currentUser.username && t.completed).length >= 5 },
        { name: 'Group Leader', icon: 'users', unlocked: appData.groups.some(g => g.leader === currentUser.username) }
      ];
      
      container.innerHTML = `
        <div class="page-container">
          <h2 style="margin-bottom: 24px;">Achievements</h2>
          
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;">
            ${achievements.map(ach => `
              <div class="card" style="text-align: center; opacity: ${ach.unlocked ? 1 : 0.5};">
                <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--purple-gradient); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                  <i data-lucide="${ach.icon}" style="color: white; width: 32px; height: 32px;"></i>
                </div>
                <h4>${ach.name}</h4>
                <div style="margin-top: 12px;">
                  ${ach.unlocked ? '✅ Unlocked' : '🔒 Locked'}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      
      lucide.createIcons();
    }

    // Utility Functions
    function openModal(modalId) {
      document.getElementById(modalId).style.display = 'flex';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    function openSettings() {
      openModal('settingsModal');
    }

    function toggleDarkMode() {
      darkMode = !darkMode;
      document.body.classList.toggle('dark-mode', darkMode);
      localStorage.setItem('darkMode', darkMode);
      const icon = document.getElementById('darkModeIcon');
      if (icon) {
        icon.setAttribute('data-lucide', darkMode ? 'sun' : 'moon');
        lucide.createIcons();
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" style="color: var(--purple-primary);"></i>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();
      
      setTimeout(() => toast.remove(), 3000);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      initializeData();
      lucide.createIcons();
      
      // Menu toggle
      const menuToggle = document.getElementById('menuToggle');
      if (menuToggle) {
        menuToggle.addEventListener('click', () => {
          document.getElementById('sidebar').classList.toggle('closed');
          document.getElementById('mainContent').classList.toggle('expanded');
        });
      }
      
      // Close modals on overlay click
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            overlay.style.display = 'none';
          }
        });
      });
      
      // Check for saved dark mode
      if (localStorage.getItem('darkMode') === 'true') {
        toggleDarkMode();
      }
    });

    // Make functions globally available
    window.selectRole = selectRole;
    window.handleLogin = handleLogin;
    window.logout = logout;
    window.switchPage = switchPage;
    window.createGroup = createGroup;
    window.openAddMemberModal = openAddMemberModal;
    window.addGroupMember = addGroupMember;
    window.toggleDarkMode = toggleDarkMode;
    window.openSettings = openSettings;
    window.openModal = openModal;
    window.closeModal = closeModal;
    window.toggleTask = toggleTask;
    window.deleteTask = deleteTask;
    window.addNewTask = addNewTask;
    window.showToast = showToast;
  </script>
</body>
</html>
