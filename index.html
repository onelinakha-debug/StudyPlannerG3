<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>StudyFlow G3 · Midnight Aurora Pro</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="data:application/manifest+json,{name:'StudyFlow G3',short_name:'StudyFlow',theme_color:'#020617',background_color:'#020617',display:'standalone',icons:[{src:'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Cdefs%3E%3ClinearGradient id=\'g\' x1=\'0%25\' y1=\'0%25\' x2=\'100%25\' y2=\'100%25\'%3E%3Cstop offset=\'0%25\' stop-color=\'%232C7FFF\'/%3E%3Cstop offset=\'100%25\' stop-color=\'%234900F4\'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=\'100\' height=\'100\' rx=\'24\' fill=\'url(%23g)\'/%3E%3Ctext x=\'50\' y=\'65\' font-family=\'Inter\' font-size=\'40\' font-weight=\'800\' fill=\'white\' text-anchor=\'middle\'%3EG3%3C/text%3E%3C/svg%3E',sizes:'512x512',type:'image/svg+xml'}]}">
  
  <!-- Fonts - Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Chart.js for analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Confetti for celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>

  <style>
    /* ===== MIDNIGHT AURORA PRO COLOR SYSTEM ===== */
    :root {
      --primary-950: #020617;
      --secondary-600: #52525C;
      --base-100: #F4F4F5;
      --elevated-00: #000000;
      --border-strong: #E4E4E7;
      --border-subtle: #F4F4F5;
      --brand-strong: #F4F4F5;
      --brand-base: #2C7FFF;
      --brand-subtle: #DBEAFE;
      --highlight-pink: #F4D2FB;
      --highlight-green: #DDF3CF;
      --highlight-purple: #4900F4;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      
      /* Typography Scale - Major Third (1.25) */
      --text-xs: 0.64rem;
      --text-sm: 0.8rem;
      --text-base: 1rem;
      --text-lg: 1.25rem;
      --text-xl: 1.563rem;
      --text-2xl: 1.953rem;
      --text-3xl: 2.441rem;
      --text-4xl: 3.052rem;
      
      /* Spacing - 8px grid */
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --space-5: 40px;
      --space-6: 48px;
      --space-8: 64px;
      --space-10: 80px;
      
      /* Border Radius */
      --radius-card: 24px;
      --radius-btn: 40px;
      --radius-modal: 32px;
      --radius-input: 16px;
      --radius-table: 20px;
      --radius-dropdown: 16px;
      
      /* Shadows */
      --shadow-sm: 0 2px 8px rgba(2, 6, 23, 0.08);
      --shadow-md: 0 8px 24px rgba(2, 6, 23, 0.12);
      --shadow-lg: 0 16px 48px rgba(2, 6, 23, 0.16);
      --shadow-glow: 0 0 20px rgba(44, 127, 255, 0.3);
      
      /* Animations */
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Dark Mode Default */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--primary-950);
      color: var(--base-100);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Light Mode */
    body.light-mode {
      --primary-950: #FFFFFF;
      --secondary-600: #A1A1AA;
      --base-100: #020617;
      --elevated-00: #FFFFFF;
      --border-strong: #E4E4E7;
      --border-subtle: #F4F4F5;
      background: #FAFAFA;
    }

    body.light-mode .glass-card {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border-strong);
    }

    /* Monospace */
    .mono {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(44, 127, 255, 0.05);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, var(--brand-base), var(--highlight-purple));
      border-radius: 10px;
    }

    /* ===== GLASSMORPHISM ===== */
    .glass-card {
      background: rgba(2, 6, 23, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(228, 228, 231, 0.1);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-md);
      transition: all var(--transition-base);
    }

    .glass-card:hover {
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      transform: scale(1.02);
      border-color: rgba(44, 127, 255, 0.3);
    }

    /* ===== BUTTONS - 6 Variants ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      padding: 10px 24px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: var(--text-sm);
      border: none;
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: 'Inter', sans-serif;
      letter-spacing: -0.01em;
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Primary - Gradient Purple/Cyan */
    .btn-primary {
      background: linear-gradient(135deg, var(--highlight-purple) 0%, var(--brand-base) 100%);
      color: white;
      box-shadow: 0 8px 18px -6px rgba(44, 127, 255, 0.4);
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 24px -8px var(--brand-base);
    }

    /* Secondary - Glass Outline */
    .btn-secondary {
      background: transparent;
      border: 1.5px solid var(--border-strong);
      color: var(--base-100);
      backdrop-filter: blur(10px);
    }

    body:not(.light-mode) .btn-secondary {
      color: var(--base-100);
      border-color: rgba(228, 228, 231, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(44, 127, 255, 0.1);
      border-color: var(--brand-base);
    }

    /* Danger - Red Gradient */
    .btn-danger {
      background: linear-gradient(135deg, #DC2626 0%, var(--danger) 100%);
      color: white;
      box-shadow: 0 8px 18px -6px rgba(239, 68, 68, 0.4);
    }

    .btn-danger:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 24px -8px var(--danger);
    }

    /* Success - Green */
    .btn-success {
      background: var(--success);
      color: white;
      box-shadow: 0 8px 18px -6px rgba(16, 185, 129, 0.4);
    }

    .btn-success:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 24px -8px var(--success);
    }

    /* Icon Only */
    .btn-icon {
      padding: 8px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(44, 127, 255, 0.1);
      border: 1px solid var(--border-subtle);
      color: var(--base-100);
    }

    body:not(.light-mode) .btn-icon {
      color: var(--base-100);
    }

    .btn-icon:hover {
      background: var(--brand-base);
      color: white;
      transform: scale(1.1);
    }

    /* Floating Action Button */
    .fab {
      position: fixed;
      bottom: var(--space-4);
      right: var(--space-4);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--highlight-purple), var(--brand-base));
      color: white;
      border: none;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-base);
      z-index: 100;
      animation: float 3s ease-in-out infinite;
    }

    .fab:hover {
      transform: scale(1.15) rotate(90deg);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* ===== TYPOGRAPHY ===== */
    h1 { font-size: var(--text-4xl); line-height: 1.2; font-weight: 800; letter-spacing: -0.02em; }
    h2 { font-size: var(--text-3xl); line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
    h3 { font-size: var(--text-2xl); line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
    h4 { font-size: var(--text-xl); line-height: 1.3; font-weight: 600; }
    h5 { font-size: var(--text-lg); line-height: 1.4; font-weight: 500; }
    h6 { font-size: var(--text-base); line-height: 1.5; font-weight: 500; }

    /* ===== LAYOUT ===== */
    .app-container {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 280px;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-strong);
      padding: var(--space-3) var(--space-2);
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 200;
      transition: transform var(--transition-base);
      overflow-y: auto;
    }

    .sidebar.closed {
      transform: translateX(-100%);
    }

    .main-content {
      flex: 1;
      margin-left: 280px;
      transition: margin-left var(--transition-base);
      min-height: 100vh;
    }

    .main-content.expanded {
      margin-left: 0;
    }

    .header {
      background: rgba(2, 6, 23, 0.6);
      backdrop-filter: blur(20px);
      padding: var(--space-2) var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-strong);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .page-container {
      padding: var(--space-4);
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ===== PAGE TRANSITIONS ===== */
    .page {
      display: none;
      animation: pageEnter 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .page.active {
      display: block;
    }

    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== PROGRESS BARS & CHARTS ===== */
    .progress-bar {
      height: 10px;
      background: rgba(44, 127, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brand-base), var(--highlight-purple));
      border-radius: 20px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { opacity: 1; }
      50% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    /* ===== STATS GRID ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .stat-card {
      background: rgba(2, 6, 23, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-card);
      padding: var(--space-3);
      transition: all var(--transition-base);
    }

    .stat-value {
      font-size: var(--text-3xl);
      font-weight: 800;
      background: linear-gradient(135deg, var(--brand-base), var(--highlight-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ===== TASK ITEMS ===== */
    .task-item {
      background: rgba(44, 127, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-input);
      padding: var(--space-2);
      margin-bottom: var(--space-1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all var(--transition-fast);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .task-item:hover {
      background: rgba(44, 127, 255, 0.1);
      border-color: var(--brand-base);
      transform: translateX(4px);
    }

    .task-item.completed {
      opacity: 0.6;
      background: rgba(16, 185, 129, 0.1);
    }

    .task-item.deleting {
      animation: deleteTask 0.3s forwards;
    }

    @keyframes deleteTask {
      to {
        opacity: 0;
        transform: scale(0.9) translateX(-20px);
      }
    }

    /* ===== BADGES ===== */
    .badge {
      padding: 4px 12px;
      border-radius: var(--radius-btn);
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-high {
      background: var(--danger);
      color: white;
    }

    .badge-medium {
      background: var(--warning);
      color: var(--primary-950);
    }

    .badge-low {
      background: var(--success);
      color: white;
    }

    /* ===== TIMETABLE ===== */
    .timetable-grid {
      display: grid;
      grid-template-columns: 80px repeat(7, 1fr);
      gap: var(--space-1);
    }

    .timetable-cell {
      background: rgba(44, 127, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-input);
      padding: var(--space-1);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      min-height: 60px;
    }

    .timetable-cell:hover {
      background: rgba(44, 127, 255, 0.15);
      border-color: var(--brand-base);
      transform: scale(1.02);
    }

    .timetable-cell.has-session {
      background: linear-gradient(135deg, var(--brand-base), var(--highlight-purple));
      color: white;
    }

    /* ===== MODALS ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-modal);
      padding: var(--space-4);
      max-width: 500px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      animation: modalEnter 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalEnter {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(-20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* ===== FILE UPLOAD ===== */
    .upload-area {
      border: 2px dashed var(--brand-base);
      border-radius: var(--radius-card);
      padding: var(--space-5);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-base);
      background: rgba(44, 127, 255, 0.05);
    }

    .upload-area:hover {
      background: rgba(44, 127, 255, 0.15);
      border-color: var(--highlight-purple);
      transform: scale(1.02);
    }

    .upload-area.drag-over {
      background: rgba(44, 127, 255, 0.2);
      border-color: var(--success);
    }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      top: var(--space-3);
      right: var(--space-3);
      z-index: 2000;
    }

    .toast {
      background: var(--primary-950);
      border: 1px solid var(--border-strong);
      border-left: 4px solid var(--brand-base);
      border-radius: var(--radius-input);
      padding: var(--space-2) var(--space-3);
      margin-bottom: var(--space-1);
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      animation: toastEnter 0.3s ease;
      backdrop-filter: blur(20px);
    }

    @keyframes toastEnter {
      from {
        opacity: 0;
        transform: translateX(100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* ===== SKELETON LOADING ===== */
    .skeleton {
      background: linear-gradient(90deg, rgba(44, 127, 255, 0.1) 25%, rgba(44, 127, 255, 0.2) 50%, rgba(44, 127, 255, 0.1) 75%);
      background-size: 200% 100%;
      animation: skeletonLoading 1.5s infinite;
      border-radius: var(--radius-input);
    }

    @keyframes skeletonLoading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        max-width: 300px;
      }
      
      .main-content {
        margin-left: 0;
      }
      
      .page-container {
        padding: var(--space-2);
      }
      
      .modal {
        animation: modalEnterMobile 0.3s ease;
      }
      
      @keyframes modalEnterMobile {
        from {
          opacity: 0;
          transform: translateY(100%);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }

    /* ===== HEATMAP ===== */
    .heatmap-cell {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      background: rgba(44, 127, 255, 0.1);
      transition: all var(--transition-fast);
    }

    .heatmap-cell:hover {
      transform: scale(1.3);
    }

    .heatmap-cell.level-1 { background: rgba(44, 127, 255, 0.2); }
    .heatmap-cell.level-2 { background: rgba(44, 127, 255, 0.4); }
    .heatmap-cell.level-3 { background: rgba(44, 127, 255, 0.6); }
    .heatmap-cell.level-4 { background: rgba(44, 127, 255, 0.8); }
    .heatmap-cell.level-5 { background: var(--brand-base); }

    /* ===== ACHIEVEMENTS ===== */
    .achievement-card {
      background: linear-gradient(135deg, rgba(73, 0, 244, 0.1), rgba(44, 127, 255, 0.1));
      border: 1px solid var(--brand-subtle);
      border-radius: var(--radius-card);
      padding: var(--space-3);
      text-align: center;
      transition: all var(--transition-base);
    }

    .achievement-card.unlocked {
      background: linear-gradient(135deg, var(--highlight-purple), var(--brand-base));
      color: white;
      animation: achievementUnlock 0.6s ease;
    }

    @keyframes achievementUnlock {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* ===== POMODORO TIMER ===== */
    .pomodoro-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-4xl);
      font-weight: 700;
      text-align: center;
      background: linear-gradient(135deg, var(--brand-base), var(--highlight-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ===== LOGIN PAGE ===== */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-950), #0F172A);
      padding: var(--space-3);
    }

    .login-card {
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-modal);
      padding: var(--space-6);
      max-width: 450px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }

    .role-btn {
      padding: var(--space-2);
      border: 2px solid var(--border-subtle);
      background: transparent;
      border-radius: var(--radius-btn);
      cursor: pointer;
      transition: all var(--transition-fast);
      color: var(--base-100);
    }

    .role-btn.active {
      border-color: var(--brand-base);
      background: linear-gradient(135deg, var(--brand-base), var(--highlight-purple));
      color: white;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <!-- Login Page -->
  <div id="loginPage" class="login-container">
    <div class="login-card">
      <div style="text-align: center; margin-bottom: var(--space-5);">
        <div style="font-size: var(--text-3xl); font-weight: 800; background: linear-gradient(135deg, var(--brand-base), var(--highlight-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">StudyFlow G3</div>
        <p style="color: var(--secondary-600); margin-top: var(--space-1);">Midnight Aurora Pro</p>
      </div>
      
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-bottom: var(--space-4);">
        <div class="role-btn active" data-role="student" onclick="selectRole('student')">
          <i data-lucide="graduation-cap"></i>
          <div style="margin-top: 4px;">Student</div>
        </div>
        <div class="role-btn" data-role="lecturer" onclick="selectRole('lecturer')">
          <i data-lucide="presentation"></i>
          <div style="margin-top: 4px;">Lecturer</div>
        </div>
        <div class="role-btn" data-role="admin" onclick="selectRole('admin')">
          <i data-lucide="shield"></i>
          <div style="margin-top: 4px;">Admin</div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div style="margin-bottom: var(--space-3);">
          <label style="display: block; margin-bottom: var(--space-1); font-weight: 500;">Username</label>
          <input type="text" id="username" class="login-input" placeholder="Enter username" required style="width: 100%; padding: 12px 16px; background: rgba(44, 127, 255, 0.05); border: 1px solid var(--border-strong); border-radius: var(--radius-input); color: var(--base-100); font-size: var(--text-base);">
        </div>
        <div style="margin-bottom: var(--space-4);">
          <label style="display: block; margin-bottom: var(--space-1); font-weight: 500;">Password</label>
          <input type="password" id="password" class="login-input" placeholder="Enter password" required style="width: 100%; padding: 12px 16px; background: rgba(44, 127, 255, 0.05); border: 1px solid var(--border-strong); border-radius: var(--radius-input); color: var(--base-100); font-size: var(--text-base);">
        </div>
        <div style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4);">
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <i data-lucide="log-in"></i>
          Sign In
        </button>
      </form>
      
      <div style="text-align: center; margin-top: var(--space-3); font-size: var(--text-sm); color: var(--secondary-600);">
        <p>Demo: student/password123 · lecturer/teach123 · admin/admin123</p>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="mainApp" class="app-container" style="display: none;">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div style="padding: var(--space-2); margin-bottom: var(--space-4); border-bottom: 1px solid var(--border-strong);">
        <div style="font-size: var(--text-2xl); font-weight: 800; background: linear-gradient(135deg, var(--brand-base), var(--highlight-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">StudyFlow G3</div>
        <div style="font-size: var(--text-xs); opacity: 0.7; margin-top: 4px;" id="userRoleDisplay"></div>
      </div>
      
      <ul style="list-style: none;" id="navMenu"></ul>
      
      <div style="margin-top: var(--space-4); padding: var(--space-2);">
        <div class="glass-card" style="padding: var(--space-3);">
          <div style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2);">
            <i data-lucide="flame" style="color: var(--warning);"></i>
            <div>
              <div style="font-weight: 600;"><span id="streakDisplay">0</span> Day Streak</div>
              <div class="progress-bar" style="margin-top: 8px;">
                <div class="progress-fill" id="streakProgress" style="width: 0%;"></div>
              </div>
            </div>
          </div>
          <div style="display: flex; justify-content: space-between; font-size: var(--text-sm);">
            <span>Level <span id="levelDisplay">1</span></span>
            <span id="xpDisplay">0 XP</span>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <header class="header">
        <div style="display: flex; align-items: center; gap: var(--space-3);">
          <button class="btn-icon" id="menuToggle">
            <i data-lucide="menu"></i>
          </button>
          <div>
            <h2 id="headerTitle">Dashboard</h2>
            <p style="opacity: 0.7; font-size: var(--text-sm);" id="welcomeMessage"></p>
          </div>
        </div>
        <div style="display: flex; gap: var(--space-2); align-items: center;">
          <div id="userBadge" style="display: flex; align-items: center; gap: var(--space-1); padding: 6px 16px; background: rgba(44, 127, 255, 0.1); border-radius: var(--radius-btn); border: 1px solid var(--border-strong);"></div>
          <button class="btn-icon" onclick="toggleLightMode()" id="themeToggle">
            <i data-lucide="sun" id="themeIcon"></i>
          </button>
          <button class="btn-icon" onclick="openSettings()">
            <i data-lucide="settings"></i>
          </button>
          <button class="btn-icon" onclick="logout()">
            <i data-lucide="log-out"></i>
          </button>
        </div>
      </header>

      <div id="pageContainer"></div>
    </main>
  </div>

  <!-- Floating Action Button -->
  <button class="fab" id="fab" style="display: none;" onclick="handleFabClick()">
    <i data-lucide="plus"></i>
  </button>

  <!-- Pomodoro Timer Modal -->
  <div class="modal-overlay" id="pomodoroModal">
    <div class="modal">
      <h3 style="margin-bottom: var(--space-3);">🍅 Pomodoro Timer</h3>
      <div class="pomodoro-timer" id="pomodoroDisplay">25:00</div>
      <div style="display: flex; gap: var(--space-2); justify-content: center; margin-top: var(--space-4);">
        <button class="btn btn-success" onclick="startPomodoro()">
          <i data-lucide="play"></i> Start
        </button>
        <button class="btn btn-secondary" onclick="pausePomodoro()">
          <i data-lucide="pause"></i> Pause
        </button>
        <button class="btn btn-danger" onclick="resetPomodoro()">
          <i data-lucide="rotate-ccw"></i> Reset
        </button>
      </div>
      <div style="margin-top: var(--space-3);">
        <label>Focus Subject</label>
        <select id="pomodoroSubject" style="width: 100%; margin-top: 8px; padding: 10px; background: rgba(44, 127, 255, 0.05); border: 1px solid var(--border-strong); border-radius: var(--radius-input); color: var(--base-100);">
          <option>Mathematics</option>
          <option>Physics</option>
          <option>Computer Science</option>
        </select>
      </div>
      <button class="btn btn-primary" style="width: 100%; margin-top: var(--space-3);" onclick="closeModal('pomodoroModal')">Close</button>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div class="modal-overlay" id="createGroupModal">
    <div class="modal">
      <h3 style="margin-bottom: var(--space-3);">Create Study Group</h3>
      <form onsubmit="createGroup(event)">
        <input type="text" id="groupName" placeholder="Group Name" required style="margin-bottom: var(--space-2); width: 100%; padding: 12px; background: rgba(44, 127, 255, 0.05); border: 1px solid var(--border-strong); border-radius: var(--radius-input); color: var(--base-100);">
        <input type="text" id="groupCourse" placeholder="Course Code" required style="margin-bottom: var(--space-2); width: 100%; padding: 12px; background: rgba(44, 127, 255, 0.05); border: 1px solid var(--border-strong); border-radius: var(--radius-input); color: var(--base-100);">
        <textarea id="groupDescription" placeholder="Description" rows="3" style="margin-bottom: var(--space-2); width: 100%; padding: 12px; background: rgba(44, 127, 255, 0.05); border: 1px solid var(--border-strong); border-radius: var(--radius-input); color: var(--base-100);"></textarea>
        <input type="number" id="maxMembers" placeholder="Max Members" value="30" style="margin-bottom: var(--space-3); width: 100%; padding: 12px; background: rgba(44, 127, 255, 0.05); border: 1px solid var(--border-strong); border-radius: var(--radius-input); color: var(--base-100);">
        <div style="display: flex; gap: var(--space-2); justify-content: flex-end;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('createGroupModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Group</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ===== GLOBAL STATE =====
    let currentUser = null;
    let selectedRole = 'student';
    let lightMode = false;
    let pomodoroInterval = null;
    let pomodoroTime = 1500; // 25 minutes in seconds
    let pomodoroRunning = false;
    
    let appData = {
      users: [],
      groups: [],
      assignments: [],
      submissions: [],
      tasks: [],
      subjects: [
        { name: 'Mathematics', color: '#2C7FFF', progress: 67, targetHours: 12, completedHours: 8 },
        { name: 'Physics', color: '#4900F4', progress: 40, targetHours: 10, completedHours: 4 },
        { name: 'Computer Science', color: '#10B981', progress: 75, targetHours: 8, completedHours: 6 }
      ],
      sessions: [],
      attachments: [],
      achievements: [],
      studyLogs: []
    };

    // ===== INITIALIZATION =====
    function initializeData() {
      const saved = localStorage.getItem('studyflow_g3_data');
      if (saved) {
        appData = JSON.parse(saved);
      } else {
        appData.users = [
          { id: '1', username: 'alex_student', password: 'password123', role: 'student', name: 'Alex Chen', level: 8, streak: 12, xp: 2450, avatar: null },
          { id: '2', username: 'prof_smith', password: 'teach123', role: 'lecturer', name: 'Dr. Sarah Smith', department: 'Computer Science', level: 15, xp: 5200 },
          { id: '3', username: 'admin', password: 'admin123', role: 'admin', name: 'Admin User', level: 99, xp: 99999 }
        ];
        
        appData.groups = [
          { id: '1', name: 'CS50 Study Group', course: 'CS50', description: 'Introduction to Computer Science', leader: 'alex_student', members: ['alex_student'], maxMembers: 30, createdAt: new Date().toISOString(), announcements: [], polls: [] }
        ];
        
        appData.tasks = [
          { id: '1', title: 'Complete Calculus Assignment', subject: 'Mathematics', deadline: '2026-04-25', priority: 'high', completed: false, userId: 'alex_student', assignedBy: null, groupId: null },
          { id: '2', title: 'Read Physics Chapter 5', subject: 'Physics', deadline: '2026-04-23', priority: 'medium', completed: false, userId: 'alex_student', assignedBy: null, groupId: null },
          { id: '3', title: 'Code Review for Project', subject: 'Computer Science', deadline: '2026-04-22', priority: 'low', completed: true, userId: 'alex_student', assignedBy: null, groupId: null }
        ];
        
        saveData();
      }
      
      // Check for saved session
      const savedUser = localStorage.getItem('studyflow_current_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        initializeApp();
      }
    }

    function saveData() {
      localStorage.setItem('studyflow_g3_data', JSON.stringify(appData));
    }

    // ===== ROLE SELECTION =====
    function selectRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.role === role) {
          btn.classList.add('active');
        }
      });
      
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      
      if (role === 'student') {
        username.value = 'alex_student';
        password.value = 'password123';
      } else if (role === 'lecturer') {
        username.value = 'prof_smith';
        password.value = 'teach123';
      } else if (role === 'admin') {
        username.value = 'admin';
        password.value = 'admin123';
      }
    }

    // ===== LOGIN =====
    function handleLogin(event) {
      event.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      
      const user = appData.users.find(u => u.username === username && u.password === password);
      
      if (user && user.role === selectedRole) {
        currentUser = user;
        
        if (rememberMe) {
          localStorage.setItem('studyflow_current_user', JSON.stringify(user));
        }
        
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        document.getElementById('fab').style.display = 'flex';
        
        initializeApp();
        showToast(`Welcome back, ${user.name}!`, 'success');
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      } else {
        showToast('Invalid credentials or role mismatch', 'error');
      }
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('studyflow_current_user');
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('fab').style.display = 'none';
      showToast('Logged out successfully');
    }

    // ===== APP INITIALIZATION =====
    function initializeApp() {
      document.getElementById('userRoleDisplay').textContent = `${currentUser.role.toUpperCase()} · ${currentUser.name}`;
      document.getElementById('welcomeMessage').textContent = `${currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1)} Dashboard · Level ${currentUser.level}`;
      document.getElementById('userBadge').innerHTML = `
        <span class="badge badge-${currentUser.role}">${currentUser.role.toUpperCase()}</span>
        <span>${currentUser.name}</span>
      `;
      document.getElementById('streakDisplay').textContent = currentUser.streak || 0;
      document.getElementById('streakProgress').style.width = `${((currentUser.streak || 0) / 30) * 100}%`;
      document.getElementById('levelDisplay').textContent = currentUser.level || 1;
      document.getElementById('xpDisplay').textContent = `${currentUser.xp || 0} XP`;
      
      setupNavigation();
      renderDashboard();
      
      lucide.createIcons();
      
      // Check for deadline reminders
      checkDeadlines();
    }

    // ===== NAVIGATION =====
    function setupNavigation() {
      const navMenu = document.getElementById('navMenu');
      let menuItems = [
        { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard' },
        { id: 'tasks', icon: 'check-square', label: 'Tasks' },
        { id: 'timetable', icon: 'calendar', label: 'Timetable' },
        { id: 'subjects', icon: 'book-open', label: 'Subjects' },
        { id: 'attachments', icon: 'paperclip', label: 'Attachments' },
        { id: 'groups', icon: 'users', label: 'Study Groups' }
      ];
      
      if (currentUser.role === 'lecturer' || currentUser.role === 'admin') {
        menuItems.push({ id: 'assignments', icon: 'file-text', label: 'Assignments' });
      }
      
      if (currentUser.role === 'student') {
        menuItems.push({ id: 'myassignments', icon: 'file-check', label: 'My Assignments' });
      }
      
      menuItems.push(
        { id: 'progress', icon: 'trending-up', label: 'Progress' },
        { id: 'achievements', icon: 'trophy', label: 'Achievements' }
      );
      
      if (currentUser.role === 'admin') {
        menuItems.push({ id: 'users', icon: 'user-plus', label: 'User Management' });
      }
      
      navMenu.innerHTML = menuItems.map(item => `
        <li style="margin-bottom: 4px;">
          <a class="nav-link ${item.id === 'dashboard' ? 'active' : ''}" onclick="switchPage('${item.id}')" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--base-100); text-decoration: none; border-radius: 12px; transition: all 0.2s; cursor: pointer;">
            <i data-lucide="${item.icon}"></i>
            ${item.label}
          </a>
        </li>
      `).join('');
      
      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('mouseenter', (e) => {
          e.currentTarget.style.background = 'rgba(44, 127, 255, 0.1)';
        });
        link.addEventListener('mouseleave', (e) => {
          if (!e.currentTarget.classList.contains('active')) {
            e.currentTarget.style.background = 'transparent';
          }
        });
      });
      
      lucide.createIcons();
    }

    function switchPage(pageName) {
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
        link.style.background = 'transparent';
      });
      event.target.closest('.nav-link').classList.add('active');
      event.target.closest('.nav-link').style.background = 'linear-gradient(135deg, var(--brand-base), var(--highlight-purple))';
      
      document.getElementById('headerTitle').textContent = pageName.charAt(0).toUpperCase() + pageName.slice(1);
      
      renderPage(pageName);
    }

    // ===== PAGE RENDERING =====
    function renderPage(pageName) {
      const container = document.getElementById('pageContainer');
      
      switch(pageName) {
        case 'dashboard': renderDashboard(); break;
        case 'tasks': renderTasks(); break;
        case 'timetable': renderTimetable(); break;
        case 'subjects': renderSubjects(); break;
        case 'attachments': renderAttachments(); break;
        case 'groups': renderGroups(); break;
        case 'assignments': renderAssignments(); break;
        case 'myassignments': renderMyAssignments(); break;
        case 'progress': renderProgress(); break;
        case 'achievements': renderAchievements(); break;
        case 'users': renderUserManagement(); break;
      }
    }

    function renderDashboard() {
      const container = document.getElementById('pageContainer');
      const myGroups = appData.groups.filter(g => g.members.includes(currentUser.username));
      const myTasks = appData.tasks.filter(t => t.userId === currentUser.username && !t.completed);
      const completedTasks = appData.tasks.filter(t => t.userId === currentUser.username && t.completed);
      
      container.innerHTML = `
        <div class="page-container">
          <div class="stats-grid">
            <div class="stat-card">
              <i data-lucide="clock" style="color: var(--brand-base); margin-bottom: 12px;"></i>
              <div class="stat-value">${calculateTodayHours()}</div>
              <div style="opacity: 0.7;">Hours Today</div>
              <div class="progress-bar" style="margin-top: 12px;">
                <div class="progress-fill" style="width: ${(calculateTodayHours() / 8) * 100}%;"></div>
              </div>
            </div>
            <div class="stat-card">
              <i data-lucide="target" style="color: var(--success); margin-bottom: 12px;"></i>
              <div class="stat-value">${completedTasks.length}</div>
              <div style="opacity: 0.7;">Tasks Completed</div>
              <div style="font-size: 12px; margin-top: 8px;">↑ ${completedTasks.length} total</div>
            </div>
            <div class="stat-card">
              <i data-lucide="users" style="color: var(--highlight-purple); margin-bottom: 12px;"></i>
              <div class="stat-value">${myGroups.length}</div>
              <div style="opacity: 0.7;">Active Groups</div>
              <div style="font-size: 12px; margin-top: 8px;">${myGroups.reduce((sum, g) => sum + g.members.length, 0)} members total</div>
            </div>
            <div class="stat-card">
              <i data-lucide="flame" style="color: var(--warning); margin-bottom: 12px;"></i>
              <div class="stat-value">${currentUser.streak || 0}</div>
              <div style="opacity: 0.7;">Day Streak</div>
              <div style="font-size: 12px; margin-top: 8px;">Best: 15 days</div>
            </div>
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
            <div class="glass-card" style="padding: 24px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h4>📋 Recent Tasks</h4>
                <button class="btn btn-secondary" onclick="switchPage('tasks')">View All</button>
              </div>
              ${myTasks.slice(0, 3).map(task => `
                <div class="task-item">
                  <div style="display: flex; align-items: center; gap: 12px;">
                    <input type="checkbox" onchange="toggleTask('${task.id}')">
                    <div>
                      <div style="font-weight: 600;">${task.title}</div>
                      <div style="font-size: 12px; opacity: 0.7;">${task.subject} · Due ${task.deadline}</div>
                    </div>
                  </div>
                  <span class="badge badge-${task.priority}">${task.priority}</span>
                </div>
              `).join('') || '<p style="opacity: 0.7; text-align: center; padding: 20px;">No pending tasks</p>'}
            </div>
            
            <div class="glass-card" style="padding: 24px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <h4>👥 My Groups</h4>
                <button class="btn btn-secondary" onclick="switchPage('groups')">View All</button>
              </div>
              ${myGroups.map(group => `
                <div class="task-item">
                  <div>
                    <div style="font-weight: 600;">${group.name}</div>
                    <div style="font-size: 12px; opacity: 0.7;">${group.course} · ${group.members.length} members</div>
                  </div>
                  ${group.leader === currentUser.username ? '<span class="badge badge-high">LEADER</span>' : ''}
                </div>
              `).join('') || '<p style="opacity: 0.7; text-align: center; padding: 20px;">No groups yet</p>'}
              <button class="btn btn-primary" style="margin-top: 16px; width: 100%;" onclick="openModal('createGroupModal')">
                <i data-lucide="plus"></i> Create New Group
              </button>
            </div>
          </div>
          
          <div class="glass-card" style="padding: 24px; margin-top: 24px;">
            <h4 style="margin-bottom: 20px;">📊 Subject Progress</h4>
            ${appData.subjects.map(subject => `
              <div style="margin-bottom: 16px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                  <span>${subject.name}</span>
                  <span>${subject.completedHours}/${subject.targetHours}h</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${(subject.completedHours / subject.targetHours) * 100}%;"></div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      
      lucide.createIcons();
    }

    function renderTasks() {
      const container = document.getElementById('pageContainer');
      const myTasks = appData.tasks.filter(t => t.userId === currentUser.username);
      
      container.innerHTML = `
        <div class="page-container">
          <div style="display: flex; justify-content: space-between; margin-bottom: 24px;">
            <h3>Task Management</h3>
            <button class="btn btn-primary" onclick="addNewTask()">
              <i data-lucide="plus"></i> Add Task
            </button>
          </div>
          
          <div class="glass-card" style="padding: 24px;">
            <div style="display: flex; gap: 12px; margin-bottom: 20px;">
              <select id="taskFilter" onchange="filterTasks()" style="padding: 10px; background: rgba(44, 127, 255, 0.05); border: 1px solid var(--border-strong); border-radius: var(--radius-input); color: var(--base-100);">
                <option value="all">All Tasks</option>
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
              </select>
              <select id="taskSort" onchange="filterTasks()" style="padding: 10px; background: rgba(44, 127, 255, 0.05); border: 1px solid var(--border-strong); border-radius: var(--radius-input); color: var(--base-100);">
                <option value="deadline">Sort by Deadline</option>
                <option value="priority">Sort by Priority</option>
              </select>
            </div>
            
            <div id="tasksList">
              ${myTasks.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}" id="task-${task.id}">
                  <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${task.id}')">
                    <div>
                      <div style="font-weight: 600;">${task.title}</div>
                      <div style="font-size: 12px; opacity: 0.7;">${task.subject} · Due ${task.deadline}</div>
                    </div>
                  </div>
                  <div style="display: flex; gap: 8px; align-items: center;">
                    <span class="badge badge-${task.priority}">${task.priority}</span>
                    <button class="btn-icon" onclick="deleteTask('${task.id}')" style="width: 32px; height: 32px;">
                      <i data-lucide="trash-2"></i>
                    </button>
                  </div>
                </div>
              `).join('') || '<p style="opacity: 0.7; text-align: center; padding: 40px;">No tasks yet</p>'}
            </div>
          </div>
        </div>
      `;
      
      lucide.createIcons();
    }

    function renderTimetable() {

    // ===== UTILITY FUNCTIONS =====
    function calculateTodayHours() {
      const today = new Date().toISOString().split('T')[0];
      const todayLogs = appData.studyLogs.filter(log => log.userId === currentUser?.username && log.date === today);
      return (todayLogs.reduce((sum, log) => sum + log.minutes, 0) / 60).toFixed(1);
    }

    function calculateTotalHours() {
      return (appData.studyLogs.filter(log => log.userId === currentUser?.username).reduce((sum, log) => sum + log.minutes, 0) / 60).toFixed(1);
    }

    function generateHeatmap() {
      let html = '';
      for (let i = 0; i < 52; i++) {
        const level = Math.floor(Math.random() * 5) + 1;
        html += `<div class="heatmap-cell level-${level}" title="${i} weeks ago"></div>`;
      }
      return html;
    }

    function renderSubjectChart() {
      const ctx = document.getElementById('subjectChart')?.getContext('2d');

        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: appData.subjects.map(s => s.name),

              data: appData.subjects.map(s => s.completedHours),

            }]

            maintainAspectRatio: true,

              legend: {

          }
        });

    function getFileIcon(type) {
      if (type?.includes('image')) return 'image';
      if (type?.includes('pdf')) return 'file-text';
      if (type?.includes('audio')) return 'music';
      if (type?.includes('video')) return 'video';
      return 'file';
    }

    function checkDeadlines() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const tomorrowStr = tomorrow.toISOString().split('T')[0];
      
      const upcomingTasks = appData.tasks.filter(t => 
        t.userId === currentUser?.username && !t.completed && t.deadline === tomorrowStr
      );
      
      if (upcomingTasks.length > 0) {
        setTimeout(() => {
          showToast(`📅 ${upcomingTasks.length} task(s) due tomorrow!`, 'warning');
        }, 5000);
      }
    }

    // ===== TASK FUNCTIONS =====
    function toggleTask(taskId) {
      const task = appData.tasks.find(t => t.id === taskId);
      if (task) {
        task.completed = !task.completed;
        
        if (task.completed) {
          currentUser.xp = (currentUser.xp || 0) + 50;
          showToast('Task completed! +50 XP 🎉', 'success');
          confetti({ particleCount: 50, spread: 60 });
          
          // Check for level up
          if (currentUser.xp >= currentUser.level * 1000) {
            currentUser.level++;
            showToast(`Level Up! You're now Level ${currentUser.level}! 🎊`, 'success');
            confetti({ particleCount: 150, spread: 100 });
          }
        }
        
        saveData();
        
        if (document.getElementById('tasksList')) {
          filterTasks();
        } else {
          renderDashboard();
        }
        
        updateUserDisplay();
      }
    }

    function deleteTask(taskId) {
      const taskElement = document.getElementById(`task-${taskId}`);
      if (taskElement) {
        taskElement.classList.add('deleting');
        setTimeout(() => {
          appData.tasks = appData.tasks.filter(t => t.id !== taskId);
          saveData();
          filterTasks();
          showToast('Task deleted');
        }, 300);
      } else {
        appData.tasks = appData.tasks.filter(t => t.id !== taskId);
        saveData();
        filterTasks();
        showToast('Task deleted');
      }
    }

    function addNewTask() {
      const title = prompt('Task title:');
      if (title) {
        const subject = prompt('Subject:', 'General');
        const priority = prompt('Priority (high/medium/low):', 'medium');
        
        const task = {
          id: Date.now().toString(),
          title,
          subject: subject || 'General',
          deadline: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          priority: priority || 'medium',
          completed: false,
          userId: currentUser.username,
          assignedBy: null,
          groupId: null
        };
        
        appData.tasks.push(task);
        saveData();
        renderTasks();
        showToast('Task added successfully!');
      }
    }

    function filterTasks() {
      const filter = document.getElementById('taskFilter')?.value || 'all';
      const sort = document.getElementById('taskSort')?.value || 'deadline';
      
      let filteredTasks = appData.tasks.filter(t => t.userId === currentUser.username);
      
      if (filter === 'pending') {
        filteredTasks = filteredTasks.filter(t => !t.completed);
      } else if (filter === 'completed') {
        filteredTasks = filteredTasks.filter(t => t.completed);
      }
      
      if (sort === 'priority') {
        const priorityOrder = { high: 1, medium: 2, low: 3 };
        filteredTasks.sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
      } else {
        filteredTasks.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
      }
      
      const tasksList = document.getElementById('tasksList');
      if (tasksList) {
        tasksList.innerHTML = filteredTasks.map(task => `
          <div class="task-item ${task.completed ? 'completed' : ''}" id="task-${task.id}">
            <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
              <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${task.id}')">
              <div>
                <div style="font-weight: 600;">${task.title}</div>
                <div style="font-size: 12px; opacity: 0.7;">${task.subject} · Due ${task.deadline}</div>
              </div>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
              <span class="badge badge-${task.priority}">${task.priority}</span>
              <button class="btn-icon" onclick="deleteTask('${task.id}')" style="width: 32px; height: 32px;">
                <i data-lucide="trash-2"></i>
              </button>
            </div>
          </div>
        `).join('') || '<p style="opacity: 0.7; text-align: center; padding: 40px;">No tasks found</p>';
        
        lucide.createIcons();
      }
    }

    // ===== FILE HANDLING =====
    function handleFileUpload(event) {
      const files = event.target.files;
      for (let file of files) {
        const attachment = {
          id: Date.now().toString() + Math.random(),
          name: file.name,
          size: (file.size / 1024 / 1024).toFixed(2) + ' MB',
          type: file.type,
          date: new Date().toLocaleDateString(),
          uploadedBy: currentUser.username
        };
        appData.attachments.push(attachment);
      }
      saveData();
      renderAttachments();
      showToast(`${files.length} file(s) uploaded successfully`);
    }

    function handleDragOver(event) {
      event.preventDefault();
      document.getElementById('uploadArea').classList.add('drag-over');
    }

    function handleDragLeave(event) {
      document.getElementById('uploadArea').classList.remove('drag-over');
    }

    function handleDrop(event) {
      event.preventDefault();
      document.getElementById('uploadArea').classList.remove('drag-over');
      
      const files = event.dataTransfer.files;
      for (let file of files) {
        const attachment = {
          id: Date.now().toString() + Math.random(),
          name: file.name,
          size: (file.size / 1024 / 1024).toFixed(2) + ' MB',
          type: file.type,
          date: new Date().toLocaleDateString(),
          uploadedBy: currentUser.username
        };
        appData.attachments.push(attachment);
      }
      saveData();
      renderAttachments();
      showToast(`${files.length} file(s) uploaded successfully`);
    }

    // ===== POMODORO =====
    function startPomodoro() {
      if (!pomodoroRunning) {
        pomodoroRunning = true;
        pomodoroInterval = setInterval(() => {
          if (pomodoroTime > 0) {
            pomodoroTime--;
            updatePomodoroDisplay();
          } else {
            clearInterval(pomodoroInterval);
            pomodoroRunning = false;
            showToast('Pomodoro complete! Take a break! 🍅', 'success');
            confetti({ particleCount: 100, spread: 70 });
            
            // Log study time
            const subject = document.getElementById('pomodoroSubject')?.value || 'General';
            appData.studyLogs.push({
              userId: currentUser.username,
              subject,
              minutes: 25,
              date: new Date().toISOString().split('T')[0],
              timestamp: new Date().toISOString()
            });
            
            // Update subject hours
            const subjectObj = appData.subjects.find(s => s.name === subject);
            if (subjectObj) {
              subjectObj.completedHours = (subjectObj.completedHours || 0) + 0.42; // 25 minutes
            }
            
            saveData();
            updateUserDisplay();
          }
        }, 1000);
      }
    }

    function pausePomodoro() {
      clearInterval(pomodoroInterval);
      pomodoroRunning = false;
    }

    function resetPomodoro() {
      clearInterval(pomodoroInterval);
      pomodoroRunning = false;
      pomodoroTime = 1500;
      updatePomodoroDisplay();
    }

    function updatePomodoroDisplay() {
      const minutes = Math.floor(pomodoroTime / 60);
      const seconds = pomodoroTime % 60;
      document.getElementById('pomodoroDisplay').textContent = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `
        <i data-lucide="${type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info'}" style="color: ${type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--warning)'};"></i>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      lucide.createIcons();
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100px)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ===== EVENT LISTENERS =====
    document.addEventListener('DOMContentLoaded', () => {
      initializeData();
      lucide.createIcons();
      
      // Menu toggle
      document.getElementById('menuToggle')?.addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('closed');
        document.getElementById('mainContent').classList.toggle('expanded');
      });
      
      // Close modals on overlay click
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            overlay.style.display = 'none';
          }
        });
      });
      
      // Load saved theme preference
      if (localStorage.getItem('lightMode') === 'true') {
        toggleLightMode();
      }
      
      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'k') {
          e.preventDefault();
          addNewTask();
        }
        if (e.ctrlKey && e.key === 'p') {
          e.preventDefault();
          openModal('pomodoroModal');
        }
        if (e.key === 'Escape') {
          document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
        }
      });
    });

    // Make functions globally available
    window.selectRole = selectRole;
    window.handleLogin = handleLogin;
    window.logout = logout;
    window.switchPage = switchPage;
    window.toggleTask = toggleTask;
    window.deleteTask = deleteTask;
    window.addNewTask = addNewTask;
    window.filterTasks = filterTasks;
    window.createGroup = createGroup;
    window.openAddMemberModal = openAddMemberModal;
    window.createPoll = createPoll;
    window.viewGroup = viewGroup;
    window.handleFileUpload = handleFileUpload;
    window.handleDragOver = handleDragOver;
    window.handleDragLeave = handleDragLeave;
    window.handleDrop = handleDrop;
    window.downloadFile = downloadFile;
    window.startPomodoro = startPomodoro;
    window.pausePomodoro = pausePomodoro;
    window.resetPomodoro = resetPomodoro;
    window.toggleLightMode = toggleLightMode;
    window.openSettings = openSettings;
    window.handleFabClick = handleFabClick;
    window.openModal = openModal;
    window.closeModal = closeModal;
    window.showToast = showToast;
    window.addSession = () => showToast('Add session coming soon!');
    window.editSession = (day, time) => showToast(`Edit session on day ${day} at ${time}`);
    window.editSubject = (name) => showToast(`Editing ${name}`);
    window.addSubject = () => showToast('Add subject coming soon!');
  </script>
</body>
</html>
